[package]
name = "crabbot-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
crabbot-shared = { path = "../crabbot-shared" }
leptos = { version = "0.8.15", features = ["csr"] }
leptos_router = "=0.8.11"

serde = { workspace = true }
serde_json = { workspace = true }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.5", features = ["eventsource"] }
gloo-events = "0.2"

console_error_panic_hook = "0.1"
tw_merge = { version = "0.1.17", features = ["variant"] }
icons = { version = "0.18.0", features = ["leptos"] }
leptos_ui = "0.3.17"
urlencoding = "2.1.3"
futures-channel = "0.3.31"

futures-util = { version = "0.3.31", features = ["sink"] }
js-sys = "0.3.85"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement"] }

[package.metadata.leptos]
tailwind-input-file = "style/tailwind.css"
